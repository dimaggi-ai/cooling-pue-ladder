name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: The validation registry reproduces
        run: python -c "import sys; from cooling.cli import main; sys.exit(main(['validate']))"
      - name: Admission answers the two ends of the ladder
        run: |
          python -c "import sys; from cooling.cli import main; sys.exit(main(['admit','--density','132','--need-ride-through','30']))"
          python -c "import sys; from cooling.cli import main; sys.exit(0 if main(['admit','--density','100','--halls','2']) == 1 else 1)"
